<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Inventory</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const Database = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
            </svg>
        );

        function RepoInventory() {
            const [repos, setRepos] = useState([]);
            const [formData, setFormData] = useState({
                repository: '',
                language: ''
            });
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState({ text: '', type: '' });

            const API_BASE = '/api/repo-inventory';

            useEffect(() => {
                fetchRepos();
            }, []);

            const fetchRepos = async () => {
                try {
                    const response = await fetch(API_BASE);
                    const data = await response.json();
                    setRepos(data);
                } catch (error) {
                    showMessage('Error fetching repositories', 'error');
                }
            };

            const handleSubmit = async () => {
                if (!formData.repository.trim() || !formData.language.trim()) {
                    showMessage('Please fill in all fields', 'error');
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        setFormData({ repository: '', language: '' });
                        showMessage('Repository added successfully!', 'success');
                        fetchRepos();
                    } else {
                        showMessage('Error adding repository', 'error');
                    }
                } catch (error) {
                    showMessage('Error adding repository', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleDelete = async (id) => {
                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        showMessage('Repository deleted', 'success');
                        fetchRepos();
                    } else {
                        showMessage('Error deleting repository', 'error');
                    }
                } catch (error) {
                    showMessage('Error deleting repository', 'error');
                }
            };

            const showMessage = (text, type) => {
                setMessage({ text, type });
                setTimeout(() => setMessage({ text: '', type: '' }), 3000);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <Database className="w-10 h-10 text-purple-400" />
                                <h1 className="text-4xl font-bold text-white">Repository Inventory</h1>
                            </div>
                            <p className="text-purple-200">MongoDB Collection: repoInventory</p>
                        </div>

                        {message.text && (
                            <div className={`mb-6 p-4 rounded-lg ${
                                message.type === 'success'
                                    ? 'bg-green-500/20 border border-green-500 text-green-200'
                                    : 'bg-red-500/20 border border-red-500 text-red-200'
                            }`}>
                                {message.text}
                            </div>
                        )}

                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl border border-white/20 mb-8">
                            <h2 className="text-2xl font-semibold text-white mb-4">Add New Repository</h2>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-purple-200 mb-2">
                                        Repository Name/URL
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.repository}
                                        onChange={(e) => setFormData({...formData, repository: e.target.value})}
                                        placeholder="e.g., github.com/user/repo or repo-name"
                                        className="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-purple-200 mb-2">
                                        Programming Language
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.language}
                                        onChange={(e) => setFormData({...formData, language: e.target.value})}
                                        placeholder="e.g., Java, Python, JavaScript"
                                        className="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>

                                <button
                                    onClick={handleSubmit}
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    <Plus className="w-5 h-5" />
                                    {loading ? 'Adding...' : 'Add Repository'}
                                </button>
                            </div>
                        </div>

                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl border border-white/20">
                            <h2 className="text-2xl font-semibold text-white mb-4">
                                Stored Repositories ({repos.length})
                            </h2>

                            {repos.length === 0 ? (
                                <p className="text-center text-purple-200 py-8">
                                    No repositories added yet. Add one above to get started!
                                </p>
                            ) : (
                                <div className="space-y-3">
                                    {repos.map((repo) => (
                                        <div
                                            key={repo.id}
                                            className="bg-white/5 border border-white/10 rounded-lg p-4 flex items-center justify-between hover:bg-white/10 transition-all"
                                        >
                                            <div className="flex-1">
                                                <h3 className="text-white font-medium text-lg mb-1">
                                                    {repo.repository}
                                                </h3>
                                                <div className="flex items-center gap-4 text-sm">
                                                    <span className="inline-block px-3 py-1 bg-purple-500/30 text-purple-200 rounded-full">
                                                        {repo.language}
                                                    </span>
                                                    {repo.createdAt && (
                                                        <span className="text-gray-400">
                                                            Added: {new Date(repo.createdAt).toLocaleDateString()}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => handleDelete(repo.id)}
                                                className="ml-4 p-2 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded-lg transition-all"
                                                title="Delete repository"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-6 p-4 bg-green-500/20 border border-green-500/50 rounded-lg">
                            <p className="text-green-200 text-sm">
                                <strong>✓ Connected to Spring Boot API</strong>
                                <br />Backend: {API_BASE}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RepoInventory />, document.getElementById('root'));
    </script>
</body>
</html>
